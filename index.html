<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeanel's Meal Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF3F0;--card:#fff;--ink:#14312B;--mute:#5B6F69;--line:#D3E0DA;--ac:#7B2D6B;--acink:#fff;--hi:#F0B429;--ok:#2E7D5B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1D19;--card:#172823;--ink:#E6F0EC;--mute:#9DB2AB;--line:#2A3F38;--ac:#D58AC6;--acink:#1B0F18;--hi:#F0B429;--ok:#6FCF9F}}
:root[data-theme="dark"]{--bg:#0F1D19;--card:#172823;--ink:#E6F0EC;--mute:#9DB2AB;--line:#2A3F38;--ac:#D58AC6;--acink:#1B0F18;--hi:#F0B429;--ok:#6FCF9F}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0;line-height:1.15}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
header{margin-bottom:16px}
h1{font-size:clamp(1.9rem,6vw,2.8rem);font-weight:800}
.sub{color:var(--mute);margin:6px 0 0;max-width:60ch}
nav{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0;z-index:5}
nav button{flex:1;padding:12px 8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:600 1rem Figtree,sans-serif;cursor:pointer}
nav button[aria-selected=true]{background:var(--ac);color:var(--acink);border-color:var(--ac)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 16px}
.bar label{font-weight:600}
select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:44px}
.bar select{width:auto}
.btn{font:600 .95rem Figtree,sans-serif;padding:10px 14px;border-radius:10px;border:1.5px solid var(--ac);background:transparent;color:var(--ac);cursor:pointer;min-height:44px}
.btn.fill{background:var(--ac);color:var(--acink)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.day h3{font-size:1.25rem;margin-bottom:10px}
.slot{margin-bottom:12px}
.slot span{display:block;font-size:.85rem;font-weight:600;color:var(--mute);margin-bottom:3px}
.ing{font-size:.82rem;color:var(--mute);margin:4px 0 0}
.sum{background:var(--card);border-left:6px solid var(--hi);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.aisle{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.aisle h3{font-size:1.1rem;margin-bottom:6px}
.it{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.it:first-of-type{border-top:0}
.it input{width:22px;height:22px;accent-color:var(--ok);flex:none}
.it b{margin-left:auto;font-weight:600;white-space:nowrap}
.it.done span{text-decoration:line-through;color:var(--mute)}
.it.done b{color:var(--mute)}
.g{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.g h3{margin-bottom:8px;font-size:1.2rem}
.g ul{margin:0;padding-left:20px}
.g li{margin:5px 0;max-width:75ch}
.macros{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:10px}
.macros div{background:var(--bg);border-radius:12px;padding:10px 12px}
.macros b{display:block;font:800 1.5rem 'Bricolage Grotesque',sans-serif}
.empty{padding:28px 8px;color:var(--mute)}
.note{font-size:.88rem;color:var(--mute);max-width:70ch}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.dh h3{margin:0}
.cp{width:auto;min-height:36px;padding:6px 10px;font-size:.85rem;font-weight:600;color:var(--ac);border-color:var(--ac)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.85rem}
.mac{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;padding:10px;background:var(--bg);border-radius:12px}
.mac div{font-size:.78rem;color:var(--mute);min-width:0}
.mac b{display:block;color:var(--ink);font-size:.95rem}
.mac i{display:block;height:5px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.mac i u{display:block;height:100%;background:var(--ok)}
.mac .over u{background:var(--hi)}
.vb{margin-top:8px}
dialog{border:0;border-radius:16px;padding:0;width:min(520px,92vw);max-height:85vh;overflow:auto;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dc{padding:20px}.dc h2{font-size:1.5rem;margin-bottom:6px}.dc h3{font-size:1.05rem;margin:16px 0 6px}
.dc ul,.dc ol{padding-left:22px;margin:0}.dc li{margin:5px 0}.dc .btn{margin-top:18px;width:100%}
@media (prefers-reduced-motion:no-preference){.it,nav button,.btn{transition:background .15s}}
</style>
</head>

M('Rice cakes & avocado','Rice cakes:2:G;Avocado:0.25:P'),M('Egg on dry toast','Eggs:1:D;Crackerbread:1:G')];
const DS=[M('Rice cakes & honey','Rice cakes:2:G;Honey:1tsp:T'),M('Dark chocolate or dates','70% dark chocolate:2blocks:T'),
M('Banana & nut butter','Banana:1:P;Almond or peanut butter:15g:T'),M('Banana protein smoothie','Protein powder:1scoop:T;Banana:1:P;Almond or peanut butter:15g:T;Plant or low-fat milk:150ml:D'),
M('Cheese slices','Cheese slices:2:D'),M('Greek yoghurt & honey','Plain low-fat Greek yoghurt:180ml:D;Honey:1tsp:T'),
M('Baked pineapple','Pineapple:150g:P'),M('Skinny hot chocolate & protein','Skinny hot chocolate:1serving:T;Protein powder:1scoop:T')];
const AI={P:'Fruit & veg',M:'Meat & fish',D:'Dairy & eggs',G:'Bread & grains',T:'Pantry'};
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const SL=[['b','Breakfast'],['l','Lunch'],['d','Dinner'],['s1','Snack 1 (mid-morning)'],['s2','Snack 2 (late afternoon)'],['x','Dessert snack (every second day)']];
const fresh=()=>({w:1,t:'plan',days:DAYS.map(()=>({})),ck:{}});
let S;try{S=JSON.parse(localStorage.getItem('jeanel-plan')||'null')}catch(e){}
S=S&&S.days?S:fresh();
const save=()=>{try{localStorage.setItem('jeanel-plan',JSON.stringify(S))}catch(e){}};
const opts=(k,w)=>k==='x'?DS:(k==='s1'||k==='s2')?SN:W[w][k];
const pick=(d,k)=>{const v=S.days[d][k];return v===undefined||v===''?null:opts(k,S.w)[+v]};
function totals(){const t={};S.days.forEach((_,d)=>SL.forEach(([k])=>{const m=pick(d,k);if(m)m.ing.forEach(i=>{const key=i.n+'|'+i.u;(t[key]=t[key]||{n:i.n,u:i.u,a:i.a,q:0}).q+=i.q})}));return t}
function fmt(q,u){if(!u)return Math.ceil(q-1e-9)+'';if(u==='g'&&q>=1000)return+(q/1000).toFixed(2)+' kg';if(u==='ml'&&q>=1000)return+(q/1000).toFixed(2)+' l';return+(Math.round(q*10)/10)+' '+u}
function macBar(d){const t=[0,0,0,0];SL.forEach(([k])=>{const m=pick(d,k);if(m)m.m.forEach((v,i)=>t[i]+=v)});
return`<div class="mac" aria-label="Daily totals against targets">${[['kcal',''],['Protein','g'],['Fat','g'],['Carbs','g']].map(([l,u],i)=>`<div class="${t[i]>TG[i]*1.1?'over':''}">${l}<b>${t[i]}${u}</b>of ${TG[i]}${u}<i><u style="width:${Math.min(100,Math.round(t[i]/TG[i]*100))}%"></u></i></div>`).join('')}</div>`}
function plan(){
let h=`<div class="bar"><label for="wk">Plan week</label><select id="wk">${[1,2,3].map(n=>`<option value="${n}"${S.w===n?' selected':''}>Week ${n} menu</option>`).join('')}</select>
<button class="btn fill" data-a="auto">Fill the week for me</button><button class="btn" data-a="clear">Clear all</button></div>
<p class="note">Each week of the plan has its own breakfast, lunch and dinner options. Snacks are shared by every week. Your picks save on this device. Macros are estimates worked out from typical food values (the plan itself doesn't list them), so treat them as a guide. Use “Copy from…” on any day to copy another day’s meals into it.</p><div class="grid">`;
S.days.forEach((dy,d)=>{h+=`<section class="day"><div class="dh"><h3>${DAYS[d]}</h3><select class="cp" data-cpd="${d}" aria-label="Copy another day into ${DAYS[d]}"><option value="">Copy from…</option>${DAYS.map((n,i)=>i===d?'':`<option value="${i}">${n}</option>`).join('')}</select></div>${macBar(d)}`;
SL.forEach(([k,l])=>{const o=opts(k,S.w),m=pick(d,k);
h+=`<div class="slot"><span>${l}</span><select data-d="${d}" data-k="${k}" aria-label="${DAYS[d]} ${l}"><option value="">${k==='x'||k[0]==='s'?'Skip':'Choose a meal'}</option>${o.map((x,i)=>`<option value="${i}"${String(dy[k])===String(i)?' selected':''}>${x.name}</option>`).join('')}</select>${m?`<p class="ing"><b>${m.m[0]} kcal</b> &middot; P ${m.m[1]}g &middot; F ${m.m[2]}g &middot; C ${m.m[3]}g<br>${m.ing.map(i=>i.q+i.u+' '+i.n).join(', ')}</p>${METHOD[m.name]?`<button class="btn sm vb" data-v="${d}|${k}">View meal &amp; method</button>`:''}`:''}</div>`});
h+='</section>'});return h+'</div>'}
function shop(){
const t=totals(),ks=Object.keys(t);
if(!ks.length)return`<p class="empty">Your list is empty. Choose meals on the Plan tab and the ingredients you need to buy will appear here.</p>`;
const done=ks.filter(k=>S.ck[k]).length;
let h=`<div class="sum"><b>${ks.length} items</b> for Week ${S.w}. ${done} ticked off.</div><div class="bar"><button class="btn fill" data-a="copy">Copy list</button><button class="btn" data-a="unck">Untick all</button></div>`;
Object.keys(AI).forEach(a=>{const it=ks.filter(k=>t[k].a===a).sort((x,y)=>t[x].n.localeCompare(t[y].n));if(!it.length)return;
h+=`<section class="aisle"><h3>${AI[a]}</h3>${it.map(k=>`<label class="it${S.ck[k]?' done':''}"><input type="checkbox" data-c="${k}"${S.ck[k]?' checked':''}><span>${t[k].n}</span><b>${fmt(t[k].q,t[k].u)}</b></label>`).join('')}</section>`});
return h+`<p class="note">Totals add up every meal you picked for the week. Tinned items, spices, salt and cooking spray are not counted exactly, so check your cupboard first.</p>`}
function guide(){return`<div class="g"><h3>Daily targets</h3><div class="macros"><div><b>1450</b>kcal</div><div><b>105 g</b>protein</div><div><b>48 g</b>fats</div><div><b>148 g</b>carbs</div></div>
<p class="note">Goal: lose 3–5 kg of fat over 10 weeks (300–500 g a week) and build about 2 kg of muscle. Add high-volume carbs for taste.</p></div>
<div class="g"><h3>No tracking? Use your hand</h3><ul><li>Protein: a fist-sized portion</li><li>Carbs: two fists</li><li>Fats: a thumb-sized portion</li><li>Snacks: half a fist of protein, one fist of carbs, a thumb of fats</li></ul></div>
<div class="g"><h3>Around training</h3><ul><li>Before: a bigger meal with protein and complex carbs 2–3 hours ahead, or a smaller one 1–2 hours ahead.</li><li>After: a smaller meal with protein and complex carbs within 1–2 hours.</li></ul></div>
<div class="g"><h3>Everyday rules</h3><ul><li>Drink 1.5–2 L (about 10 glasses) of water a day.</li><li>Cook with Spray & Cook, olive oil or steam. Avoid butter for cooking.</li><li>One diet drink when needed, and one cappuccino every third day.</li><li>No sugar in drinks: sweetener, 1 tsp honey or xylitol only.</li><li>3–4 cups of coffee, tea or skinny hot chocolate a day, with 25 ml plant-based or fat-free milk per cup.</li><li>Season with chilli, lemon, garlic, herbs, pepper and natural spices. Use low-calorie sauces. Limit mayonnaise to 1 tsp.</li><li>No alcohol for the first 2 weeks, then one drink a week. One glass of wine (150 ml) or two single whiskies can replace your dessert snack.</li><li>One cheat meal a week.</li><li>You can swap lunch and dinner around.</li><li>Have 2 snacks a day, and a dessert snack every second day.</li></ul></div>
<div class="g"><h3>Easy swaps</h3><ul><li>Berries: strawberries, blueberries, raspberries, mixed berries</li><li>Meat: lean pork for chicken, fish for chicken, extra-lean mince for lean steak</li><li>Carbs: 4–6 Provitas for 3–4 rice cakes</li><li>Veg: cauliflower, broccoli, zucchini, spinach, green beans; potato for sweet potato</li></ul></div>
<p class="note">Questions about the plan? Contact janine@justfit.co.za.</p>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===S.t));
document.getElementById('view').innerHTML=S.t==='plan'?plan():S.t==='shop'?shop():guide();save()}
const qf=q=>({0.25:'¼',0.5:'½'}[q]||q);
function openMeal(key){const[d,k]=key.split('|'),m=pick(+d,k);if(!m)return;const dl=document.getElementById('dlg');
dl.innerHTML=`<div class="dc"><h2 id="dt">${m.name}</h2><p class="note">${SL.find(x=>x[0]===k)[1]}, ${DAYS[d]} &middot; ${m.m[0]} kcal &middot; P ${m.m[1]}g &middot; F ${m.m[2]}g &middot; C ${m.m[3]}g</p><h3>Ingredients</h3><ul>${m.ing.map(i=>`<li><b>${qf(i.q)}${i.u?' '+i.u:''}</b> ${i.n}</li>`).join('')}</ul><h3>Method</h3><ol>${METHOD[m.name].map(t=>`<li>${t}</li>`).join('')}</ol><button class="btn fill" data-x>Close</button></div>`;dl.showModal()}
document.addEventListener('click',e=>{
const v=e.target.closest('[data-v]');if(v){openMeal(v.dataset.v);return}
if(e.target.closest('[data-x]')||e.target.id==='dlg'){document.getElementById('dlg').close();return}
const t=e.target.closest('[data-t]');if(t){S.t=t.dataset.t;render();scrollTo(0,0);return}
const a=e.target.closest('[data-a]');if(!a)return;const x=a.dataset.a;
if(x==='clear'){S.days=DAYS.map(()=>({}));S.ck={};render()}
if(x==='auto'){S.days=DAYS.map((_,i)=>({b:i%4,l:(i+1)%4,d:(i+2)%4,s1:i%SN.length,s2:(i+3)%SN.length,x:i%2===0?(i/2)%DS.length:''}));S.ck={};render()}
if(x==='unck'){S.ck={};render()}
if(x==='copy'){const t=totals();let s="Shopping list - Week "+S.w+"\n";Object.keys(AI).forEach(k=>{const it=Object.values(t).filter(v=>v.a===k);if(it.length)s+="\n"+AI[k]+"\n"+it.map(v=>"- "+v.n+": "+fmt(v.q,v.u)).join("\n")+"\n"});
try{navigator.clipboard.writeText(s).then(()=>{a.textContent='Copied'},()=>{a.textContent='Copy blocked: select the list manually'})}catch(err){a.textContent='Copy blocked: select the list manually'}}});
document.addEventListener('change',e=>{const el=e.target;
if(el.id==='wk'){S.w=+el.value;S.days.forEach(d=>{delete d.b;delete d.l;delete d.d});S.ck={};render()}
else if(el.dataset.cpd){if(el.value!==''){S.days[+el.dataset.cpd]={...S.days[+el.value]};S.ck={};render()}}
else if(el.dataset.k){S.days[+el.dataset.d][el.dataset.k]=el.value;S.ck={};render();el.focus?.()}
else if(el.dataset.c){if(el.checked)S.ck[el.dataset.c]=true;else delete S.ck[el.dataset.c];render()}});
render();
</script>
</body>
</html>
